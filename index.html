  <script>
    // Aplica o tema antes do Angular carregar, para a página não "piscar" com o tema errado.
    // Usa a mesma chave do localStorage que o SelecionarTemaComponent, que valida o tema depois.
    // Sem escolha salva, o escuro só é usado se o sistema operacional pedir.
    (function () {
      var tema = null;
      try {
        tema = JSON.parse(localStorage.getItem('theme'));
      } catch (e) { }

      if (!tema) {
        var sistemaEscuro = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
        tema = sistemaEscuro ? 'dark-theme' : 'light-theme';
      }

      document.documentElement.classList.add(tema);
    })();
  </script>
